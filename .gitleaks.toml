title = "sid200ok.github.io gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore local env and config files (supports Docker /scan/ paths)"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)assets/js/config\.template\.js$''',
  '''(^|/)assets/js/config\.js$''',
  '''(^|/)assets/js/config\.js\.tmp$''',
  '''(^|/)supabase/config\.toml$''',
]
