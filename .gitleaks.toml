title = "sid200ok.github.io gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore template, example, and gitignored runtime files in local --no-git scans"
paths = [
  '''^\.env$''',
  '''^\.env\.example$''',
  '''^assets/js/config\.template\.js$''',
  '''^assets/js/config\.js$''',
  '''^assets/js/config\.js\.tmp$''',
  '''^supabase/config\.toml$''',
]
