minimum_pre_commit_version: "3.5.0"
exclude: '^(assets/css/app\.css|assets/js/config\.js|dist/|package-lock\.json)'
repos:
  - repo: local
    hooks:
      - id: forbid-dotenv-in-index
        name: forbid committing .env
        entry: ".env must never be committed. Use .env.example."
        language: fail
        files: '(^|/)\.env(\.|$)'
      - id: gitleaks-staged
        name: gitleaks (staged index, native)
        entry: scripts/gitleaks-staged.sh
        language: script
        pass_filenames: true
        require_serial: true
        files: '\.(env|example|js|mjs|cjs|ts|tsx|json|toml|ya?ml|sql|sh|html?|css|py|md|txt|conf|ini)$'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-toml
      - id: check-yaml
      - id: check-json
