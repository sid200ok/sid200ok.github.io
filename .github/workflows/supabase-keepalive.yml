name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch: {} # Allows manual triggering
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database to prevent idle pause
        run: |
          # Query the projects table. Now that grants are fixed, this will return 200 OK.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ vars.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1")

          echo "Supabase DB Ping HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Failed to ping Supabase DB. Status: $HTTP_CODE"
            exit 1
          fi
          echo "✅ Supabase keep-alive ping successful!"
