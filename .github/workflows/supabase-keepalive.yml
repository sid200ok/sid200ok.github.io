name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch: {} # Allows manual triggering
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent idle pause
        run: |
          # The /auth/v1/health endpoint is always public, requires no tables/RLS, 
          # and reliably returns 200 OK. This is enough to register activity.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_URL }}/auth/v1/health")
          echo "Supabase Health Check HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Failed to ping Supabase. Status: $HTTP_CODE"
            exit 1
          fi
          echo "✅ Supabase keep-alive ping successful!"
