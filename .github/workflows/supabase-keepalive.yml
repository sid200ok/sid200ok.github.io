name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch: {} # Allows manual triggering
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent idle pause
        run: |
          # -f (--fail) makes curl exit with code 22 if the HTTP status is >= 400
          # -s (--silent) hides the progress bar
          # -S (--show-error) ensures errors are still printed if it fails
          curl -fsS "${{ vars.SUPABASE_URL }}/auth/v1/health"
          echo "✅ Supabase keep-alive ping successful!"
