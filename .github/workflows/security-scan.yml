name: Security Scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git --source /repo --redact \
            --config /repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/gitleaks-working.sarif \
            --exit-code 1

      - name: Scan full git history
        if: always()
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact \
            --config /repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/gitleaks-history.sarif \
            --exit-code 1

      - name: Ensure SARIF files exist
        if: always()
        run: |
          for f in gitleaks-working.sarif gitleaks-history.sarif; do
            if [ ! -s "$f" ]; then
              printf '{"version":"2.1.0","runs":[]}\n' > "$f"
            fi
          done

      - name: Upload working-tree SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-working.sarif
          category: gitleaks-working

      - name: Upload history SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-history.sarif
          category: gitleaks-history
