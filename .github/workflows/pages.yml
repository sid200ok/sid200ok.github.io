name: pages
# Actions deployment fixes two things at once:
#  1. dist/ is gitignored, so "Deploy from a branch" can never serve built output.
#  2. Repo-root dotfiles (.gitleaks.toml, .env, supabase/, scripts/) become
#     unreachable at https://sid200ok.github.io/<path>.
# One-time local setup: gh api -X PUT repos/{owner}/{repo}/pages -f build_type=workflow
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate assets/js/config.js
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p assets/js
          U="${SUPABASE_URL:-https://REPLACE_ME.supabase.co}"
          K="${SUPABASE_ANON_KEY:-REPLACE_ME}"
          if [ -f assets/js/config.template.js ]; then
            sed -e "s|__SUPABASE_URL__|${U}|g" -e "s|__SUPABASE_ANON_KEY__|${K}|g" \
                assets/js/config.template.js > assets/js/config.js
          else
            printf '// generated by pages.yml\nwindow.__APP_CONFIG__={supabaseUrl:%s,supabaseAnonKey:%s};\n' \
              "\"$U\"" "\"$K\"" > assets/js/config.js
          fi
          cat assets/js/config.js
      - name: Install + build
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          else echo "no package.json: treating repo root as static source"; fi
          if [ -f package.json ] && [ "$(npm pkg get scripts.build)" != "{}" ]; then npm run build; fi
      - name: Normalise dist/
        run: |
          set -euo pipefail
          if [ -d dist ]; then echo "using ./dist"
          elif [ -d build ]; then mv build dist
          else
            mkdir -p dist
            rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
                  --exclude='supabase' --exclude='scripts' --exclude='tests' \
                  --exclude='.env' --exclude='.env.*' --exclude='.gitleaks.toml' \
                  --exclude='.pre-commit-config.yaml' --exclude='dist' ./ dist/
          fi
          touch dist/.nojekyll
      - name: gitleaks scan of BUILT output (blocks deploy on hit)
        run: |
          set +e
          docker run --rm -v "$PWD/dist:/scan:ro" -v "$PWD/.gitleaks.toml:/cfg/.gitleaks.toml:ro" \
            "zricethezav/gitleaks:${GITLEAKS_PIN:-latest}" \
            dir /scan --config /cfg/.gitleaks.toml --redact --no-banner --exit-code 1
          rc=$?; set -e
          if [ "$rc" -eq 1 ]; then echo "::error::secret inlined into dist/ — refusing to deploy"; exit 1; fi
          [ "$rc" -eq 0 ] || { echo "::error::gitleaks harness failure ($rc)"; exit 1; }
      - name: Sanity — dist not empty, has index
        run: |
          set -euo pipefail
          [ -f dist/index.html ] || { echo "::error::dist/index.html missing"; exit 1; }
          n="$(find dist -type f | wc -l | tr -d ' ')"; echo "files: $n"
          [ "$n" -ge 3 ] || { echo "::error::dist too small ($n files)"; exit 1; }
          sz="$(du -sb dist | cut -f1)"; echo "bytes: $sz"
          [ "$sz" -ge 20000 ] || { echo "::error::dist suspiciously small ($sz B)"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist, retention-days: 7 }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
          code="$(curl -sS -o /tmp/page.html -w '%{http_code}' -L "$url")"; echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::root returned $code"; exit 1; }
          for needle in "Siddhant" "VoIP" "Contact"; do
            grep -qi "$needle" /tmp/page.html || { echo "::error::live page missing '$needle'"; exit 1; }
          done
          for f in ".gitleaks.toml" ".env" "supabase/config.toml" "scripts/audit-secrets.sh"; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' -L "${url}${f}")"
            [ "$c" = "200" ] && { echo "::error::PRIVATE FILE SERVED at ${url}${f}"; exit 1; }
            echo "  ${f} -> ${c}"
          done
          echo "smoke test passed"
